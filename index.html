<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vrankovi - Mapa Expedic</title>

<!-- Leaflet CSS -->
<link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: Arial, sans-serif;
        background: #f2f2f2;
    }

    h1 {
        text-align: center;
        padding: 15px;
        background: #2c3e50;
        color: white;
    }

    #map {
        width: 100%;
        height: calc(100vh - 60px);
    }
</style>
</head>
<body>

<h1>Mapa Expedic</h1>

<div id="map"></div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

// Create the map
const map = L.map("map");

// OpenStreetMap layer
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    attribution: "&copy; OpenStreetMap contributors",
    maxZoom: 19
}).addTo(map);

// Group for markers
const group = L.featureGroup().addTo(map);

// Load markers from JSON
fetch("markers.json")
    .then(response => {
        if (!response.ok) {
            throw new Error("Could not load markers.json");
        }
        return response.json();
    })
    .then(locations => {

        locations.forEach(location => {

            const marker = L.marker([location.lat, location.lng]);

            marker.bindPopup(`
                <h3>${location.name}</h3>
                <p>${location.description}</p>
                <b>Latitude:</b> ${location.lat}<br>
                <b>Longitude:</b> ${location.lng}
            `);

            marker.addTo(group);

        });

        // Zoom to show all markers
        if (locations.length > 0) {
            map.fitBounds(group.getBounds(), {
                padding: [50, 50]
            });
        } else {
            map.setView([0, 0], 2);
        }

    })
    .catch(error => {
        console.error(error);

        // Default view if JSON cannot be loaded
        map.setView([20, 0], 2);
    });

// Optional: Add markers by clicking on the map

</script>

</body>
</html>
