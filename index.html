<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moje mapa se špendlíky</title>

    <!-- 1. Připojení CSS pro Leaflet mapu -->
    <link rel="stylesheet" href="https://unpkg.com" />

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        /* 2. Kontejner MUSÍ mít definovanou výšku, jinak bude neviditelný */
        #map {
            width: 100%;
            height: 100vh; 
        }
    </style>
</head>
<body>

    <!-- Místo pro mapu -->
    <div id="map"></div>

    <!-- 3. SPRÁVNÉ připojení JavaScriptu pro Leaflet (opraveno na src) -->
    <script src="https://unpkg.com"></script>

    <script>
        // 4. Inicializace mapy (střed Praha)
        const map = L.map('map').setView([50.0878, 14.4205], 13);

        // 5. Načtení mapových podkladů
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        // 6. Přidání jednoho testovacího špendlíku
        L.marker([50.0878, 14.4205]).addTo(map)
            .bindPopup("<b>Staroměstské náměstí</b>")
            .openPopup();
    </script>
</body>
</html>
