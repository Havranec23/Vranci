<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leaflet Map with Markers</title>

<!-- Leaflet CSS -->
<link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: Arial, sans-serif;
        background: #f2f2f2;
    }

    h1 {
        text-align: center;
        padding: 15px;
        background: #2c3e50;
        color: white;
    }

    #map {
        width: 100%;
        height: calc(100vh - 60px);
    }
</style>
</head>
<body>

<h1>Leaflet Map Example</h1>

<div id="map"></div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

// Create map
const map = L.map('map');

// OpenStreetMap tiles
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap Contributors',
    maxZoom: 19
}).addTo(map);

// Colored marker icons
const redIcon = new L.Icon({
    iconUrl: "https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-red.png",
    shadowUrl: "https://unpkg.com/leaflet@1.9.4/dist/images/marker-shadow.png",
    iconSize: [25,41],
    iconAnchor: [12,41],
    popupAnchor: [1,-34],
    shadowSize: [41,41]
});

const blueIcon = new L.Icon({
    iconUrl: "https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-blue.png",
    shadowUrl: "https://unpkg.com/leaflet@1.9.4/dist/images/marker-shadow.png",
    iconSize: [25,41],
    iconAnchor: [12,41],
    popupAnchor: [1,-34],
    shadowSize: [41,41]
});

const greenIcon = new L.Icon({
    iconUrl: "https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-green.png",
    shadowUrl: "https://unpkg.com/leaflet@1.9.4/dist/images/marker-shadow.png",
    iconSize: [25,41],
    iconAnchor: [12,41],
    popupAnchor: [1,-34],
    shadowSize: [41,41]
});

// Marker data
const locations = [
    {
        name: "New York",
        lat: 40.7128,
        lng: -74.0060,
        icon: blueIcon,
        description: "The Big Apple"
    },
    {
        name: "London",
        lat: 51.5074,
        lng: -0.1278,
        icon: greenIcon,
        description: "Capital of England"
    },
    {
        name: "Paris",
        lat: 48.8566,
        lng: 2.3522,
        icon: redIcon,
        description: "City of Light"
    },
    {
        name: "Tokyo",
        lat: 35.6762,
        lng: 139.6503,
        icon: blueIcon,
        description: "Capital of Japan"
    }
];

// Store markers
const group = L.featureGroup();

locations.forEach(location => {

    const marker = L.marker(
        [location.lat, location.lng],
        { icon: location.icon }
    );

    marker.bindPopup(`
        <h3>${location.name}</h3>
        <p>${location.description}</p>
        <b>Latitude:</b> ${location.lat}<br>
        <b>Longitude:</b> ${location.lng}
    `);

    marker.addTo(group);
});

group.addTo(map);

// Zoom to fit all markers
map.fitBounds(group.getBounds(), {
    padding: [50, 50]
});

// Add marker when clicking map
map.on("click", function(e) {

    L.marker(e.latlng)
        .addTo(map)
        .bindPopup(`
            <b>Custom Marker</b><br>
            Lat: ${e.latlng.lat.toFixed(5)}<br>
            Lng: ${e.latlng.lng.toFixed(5)}
        `)
        .openPopup();

});

</script>

</body>
</html>
