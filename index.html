<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moje mapa se špendlíky</title>

    <!-- 1. Připojení CSS pro Leaflet mapu -->
    <link rel="stylesheet" href="https://unpkg.com" />

    <style>
        /* Základní reset stránky */
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        /* 2. Stylování kontejneru pro mapu (musí mít definovanou výšku) */
        #map {
            width: 100%;
            height: 100vh; /* Mapa přes celou obrazovku */
        }
    </style>
</head>
<body>

    <!-- Kontejner, do kterého se mapa vykreslí -->
    <div id="map"></div>

    <!-- 3. Připojení JavaScriptu pro Leaflet mapu -->
    <script href="https://unpkg.com"></script>

    <script>
        // 4. Inicializace mapy (nastavení středu a přiblížení - např. Praha)
        // Souřadnice: [zeměpisná šířka, zeměpisná délka], přiblížení: 13
        const map = L.map('map').setView([50.0878, 14.4205], 13);

        // 5. Načtení mapových podkladů z OpenStreetMap
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© <a href="https://openstreetmap.org">OpenStreetMap</a> contributors'
        }).addTo(map);

        // 6. Přidání špendlíků (markerů)

        // První špendlík - Staroměstské náměstí
        const marker1 = L.marker([50.0878, 14.4205]).addTo(map);
        // Přidání vyskakovacího okna (popup) po kliknutí
        marker1.bindPopup("<b>Staroměstské náměstí</b><br>Srdce historické Prahy.").openPopup();

        // Druhý špendlík - Karlův most
        const marker2 = L.marker([50.0864, 14.4114]).addTo(map);
        marker2.bindPopup("<b>Karlův most</b><br>Slavný historický most přes Vltavu.");

        // Třetí špendlík - Pražský hrad
        const marker3 = L.marker([50.0902, 14.4006]).addTo(map);
        marker3.bindPopup("<b>Pražský hrad</b><br>Největší starobylý hradní komplex na světě.");
    </script>
</body>
</html>
